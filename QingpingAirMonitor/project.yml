name: QingpingAirMonitor
options:
  bundleIdPrefix: com.qingping
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"

targets:
  QingpingAirMonitor:
    type: application
    platform: macOS
    sources:
      - path: QingpingAirMonitor
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingping.air-monitor
        INFOPLIST_FILE: QingpingAirMonitor/App/Info.plist
        PRODUCT_NAME: "Qingping Air Monitor"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    entitlements:
      path: QingpingAirMonitor/App/QingpingAirMonitor.entitlements

schemes:
  QingpingAirMonitor:
    build:
      targets:
        QingpingAirMonitor: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
